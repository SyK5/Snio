name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/syk5/snio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/syk5/snio-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy-bundle
          cp deploy/docker-compose.prod.yml deploy-bundle/docker-compose.yml
          cp deploy/Caddyfile deploy-bundle/Caddyfile

      - name: Upload deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy-bundle/*"
          target: /tmp/snio-deploy
          strip_components: 1
          overwrite: true

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            test -f /opt/snio/.env
            cp /tmp/snio-deploy/docker-compose.yml /opt/snio/docker-compose.yml
            cp /tmp/snio-deploy/Caddyfile /opt/snio/Caddyfile
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            cd /opt/snio
            docker compose pull
            docker compose run --rm api \
              node_modules/.bin/prisma migrate deploy \
              --schema=apps/api/prisma/schema.prisma
            docker compose up -d
            docker image prune -f

  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Discord notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          ack_no_webhook: true
          status: ${{ needs.deploy.result }}
          title: Snio Deployment
          description: |
            Build: ${{ needs.build.result }}
            Deploy: ${{ needs.deploy.result }}
            Commit: ${{ github.event.head_commit.message }}
